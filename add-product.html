
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReMarket - Sell Item</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f6;
            color: #1f2937;
            line-height: 1.6;
            min-height: 100vh;
        }

        .navbar {
            min-height: 74px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 7%;
            box-shadow: 0 2px 14px rgba(20, 83, 45, 0.07);
            border-bottom: 1px solid #e5eee7;
        }

        .logo {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #16834a;
            text-decoration: none;
        }

        .back-link {
            text-decoration: none;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 16px;
            border: 1px solid #dce8df;
            border-radius: 9px;
            transition: 0.2s ease;
        }

        .back-link:hover {
            color: #16834a;
            background: #edf8f0;
            border-color: #16834a;
        }

        .page {
            width: 680px;
            max-width: 92%;
            margin: 42px auto 60px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-title h1 {
            font-size: 34px;
            line-height: 1.25;
            letter-spacing: -0.8px;
            color: #173c29;
            margin-bottom: 10px;
        }

        .page-title p {
            color: #6b7280;
            font-size: 15px;
        }

        .form-card {
            background: #ffffff;
            padding: 36px;
            border: 1px solid #e3ece5;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(24, 70, 43, 0.07);
        }

        .form-group {
            margin-bottom: 23px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: #263b2e;
            margin-bottom: 9px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7e2d9;
            border-radius: 10px;
            background: #ffffff;
            color: #1f2937;
            font-size: 15px;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
            transition: border-color 0.2s ease,
            box-shadow 0.2s ease;
        }

        .form-group input,
        .form-group select {
            min-height: 48px;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #9ca3af;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #239653;
            box-shadow: 0 0 0 3px rgba(35, 150, 83, 0.12);
        }

        .form-group textarea {
            min-height: 125px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group input[type="file"] {
            padding: 10px;
            background: #f8fbf8;
            cursor: pointer;
        }

        .form-group input[type="file"]::file-selector-button {
            padding: 8px 12px;
            margin-right: 12px;
            border: none;
            border-radius: 7px;
            background: #e4f4e8;
            color: #176b39;
            font-weight: 700;
            cursor: pointer;
        }

        .image-preview {
            display: none;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin-top: 15px;
            padding: 10px;
            background: #f7faf7;
            border: 1px solid #e0e9e1;
            border-radius: 12px;
        }

        .image-help {
            color: #778279;
            font-size: 12px;
            margin-top: 8px;
        }

        .sell-button {
            width: 100%;
            min-height: 51px;
            padding: 14px 18px;
            background: #19864b;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 5px 12px rgba(25, 134, 75, 0.16);
            transition: background 0.2s ease,
            transform 0.2s ease,
            box-shadow 0.2s ease;
        }

        .sell-button:hover {
            background: #146c3c;
            box-shadow: 0 7px 16px rgba(25, 134, 75, 0.22);
            transform: translateY(-1px);
        }

        .sell-button:active {
            transform: translateY(0);
        }

        .sell-button:disabled {
            background: #8bb99b;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            overflow-wrap: anywhere;
            border: 1px solid transparent;
        }

        @media (max-width: 600px) {
            .navbar {
                min-height: 66px;
                padding: 12px 5%;
            }

            .logo {
                font-size: 25px;
            }

            .back-link {
                padding: 8px 10px;
                font-size: 13px;
            }

            .page {
                max-width: 92%;
                margin: 30px auto 40px;
            }

            .page-title {
                margin-bottom: 22px;
            }

            .page-title h1 {
                font-size: 28px;
            }

            .page-title p {
                font-size: 14px;
            }

            .form-card {
                padding: 23px 19px;
                border-radius: 14px;
            }

            .form-group {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 360px) {
            .logo {
                font-size: 22px;
            }

            .back-link {
                padding: 7px 8px;
                font-size: 12px;
            }

            .form-card {
                padding: 18px 14px;
            }
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout-button {
            background: #176b5b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .logout-button:hover {
            background: #105347;
        }

        @media (max-width: 600px) {
            .nav-actions {
                gap: 6px;
            }

            .logout-button {
                padding: 9px 11px;
                font-size: 12px;
            }
        }

    </style>
</head>

<body>

<nav class="navbar">
    <a href="home.html" class="logo">ReMarket</a>

    <div class="nav-actions">
        <a href="home.html" class="back-link">← Back to Home</a>

        <button type="button" class="logout-button" onclick="logout()">
            Logout
        </button>
    </div>
</nav>


<div class="page">
    <div class="page-title">
        <h1>Sell Your Item</h1>
        <p>Add your product details and reach potential buyers.</p>
    </div>

    <div class="form-card">
        <form id="productForm">

            <div class="form-group">
                <label for="productName">Product Name</label>
                <input type="text" id="productName"
                       placeholder="Enter product name" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select a category</option>
                    <option value="Mobiles">Mobiles</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Vehicles">Vehicles</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Books">Books</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" id="price"
                       placeholder="Enter price" min="1" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location"
                       placeholder="Enter your location" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"
                          placeholder="Describe your item..."
                          required></textarea>
            </div>

            <div class="form-group">
                <label for="image">Product Image</label>
                <input type="file" id="image"
                       accept="image/jpeg,image/png,image/webp,image/gif">

                <p class="image-help">
                    JPG, PNG, WEBP or GIF. Maximum size: 5 MB.
                </p>

                <img id="imagePreview"
                     class="image-preview"
                     alt="Selected product image preview">
            </div>

            <button type="submit" class="sell-button" id="submitButton">
                Post Item
            </button>

            <div id="message" role="status" aria-live="polite"></div>

        </form>
    </div>
</div>

<script>
    const productForm = document.getElementById("productForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");

    let previewUrl = null;

    function showMessage(text, success) {
        message.textContent = text;
        message.style.display = "block";
        message.style.background = success ? "#dcfce7" : "#fee2e2";
        message.style.color = success ? "#166534" : "#991b1b";
    }

    imageInput.addEventListener("change", function () {
        const file = imageInput.files[0];

        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
            previewUrl = null;
        }

        imagePreview.removeAttribute("src");
        imagePreview.style.display = "none";

        if (!file) return;

        const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp",
            "image/gif"
        ];

        if (!allowedTypes.includes(file.type)) {
            imageInput.value = "";
            showMessage("Please select a JPG, PNG, WEBP or GIF image.", false);
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            imageInput.value = "";
            showMessage("Image size must be 5 MB or less.", false);
            return;
        }

        previewUrl = URL.createObjectURL(file);
        imagePreview.src = previewUrl;
        imagePreview.style.display = "block";
        message.style.display = "none";
    });

    productForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const sellerEmail = localStorage.getItem("userEmail");

        if (!sellerEmail || !sellerEmail.trim()) {
            alert("Please log in before posting a product.");
            window.location.href = "login.html";
            return;
        }


        submitButton.disabled = true;
        submitButton.textContent = "Posting...";

        try {
            let imageName = "";
            const selectedImage = imageInput.files[0];

            // Upload the selected image first.
            if (selectedImage) {
                const formData = new FormData();
                formData.append("image", selectedImage);

                const uploadResponse = await fetch(
                    "/api/products/upload-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                if (!uploadResponse.ok) {
                    const errorText = await uploadResponse.text();
                    throw new Error(
                        errorText || "Image upload failed."
                    );
                }

                const uploadResult = await uploadResponse.json();
                imageName = uploadResult.imageName;

                if (!imageName) {
                    throw new Error(
                        "The server did not return an image path."
                    );
                }
            }

            // Save product details together with the uploaded image path.
            const product = {
                productName: document.getElementById("productName").value.trim(),
                category: document.getElementById("category").value,
                price: Number(document.getElementById("price").value),
                location: document.getElementById("location").value.trim(),
                description: document.getElementById("description").value.trim(),
                imageName: imageName,
                sellerEmail: sellerEmail.trim()
            };

            const response = await fetch("/api/products", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(product)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                    errorText || "Failed to save the product."
                );
            }

            showMessage("Product posted successfully!", true);
            productForm.reset();

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
                previewUrl = null;
            }

            imagePreview.removeAttribute("src");
            imagePreview.style.display = "none";

        } catch (error) {
            showMessage(
                error.message || "Unable to connect to the server.",
                false
            );
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Post Item";
        }
    });

    window.addEventListener("beforeunload", function () {
        if (previewUrl) {
            URL.revokeObjectURL(previewUrl);
        }
    });

    function logout() {
        const confirmed = window.confirm("Are you sure you want to logout?");

        if (!confirmed) {
            return;
        }

        localStorage.removeItem("userEmail");
        window.location.href = "login.html";
    }


</script>

</body>
</html>
